# v* タグを push すると、各ターゲットのバイナリを作ってリリースに載せる。
# 来歴(SLSA build provenance)と SBOM(CycloneDX)の attestation を付けるので、
# 使う側は `gh attestation verify <file> -R shiroinock/dept` で確かめられる。
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  # タグと Cargo.toml の version がずれていたら、ビルドする前に止める
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: タグと Cargo.toml の version をそろえる
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::タグ $TAG と Cargo.toml の version $version が違います"
            exit 1
          fi

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target "$TARGET"
      - name: package
        run: |
          mkdir -p staging dist
          cp "target/$TARGET/release/dept" README.md staging/
          tar -czf "dist/dept-$TARGET.tar.gz" -C staging .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dept-${{ matrix.target }}
          path: dist/dept-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # リリースを作る
      id-token: write # attestation の署名(Sigstore)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: dept-*
          merge-multiple: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: SBOM(CycloneDX)
        run: |
          cargo install --locked cargo-cyclonedx --version 0.5.10
          cargo cyclonedx --format json --spec-version 1.5 --override-filename dept.cdx
          mv dept.cdx.json dist/
      - name: checksums
        working-directory: dist
        run: sha256sum dept-*.tar.gz dept.cdx.json > SHA256SUMS
      # sbom-path が無ければ来歴(SLSA build provenance)、あれば SBOM の attestation になる
      - name: 来歴の attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/dept-*.tar.gz
      - name: SBOM の attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/dept-*.tar.gz
          sbom-path: dist/dept.cdx.json
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --title "$TAG" --generate-notes --verify-tag
